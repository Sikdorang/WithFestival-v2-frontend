name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          set -eux
          pnpm --filter app exec eslint --version
          pnpm --filter @repo/ui run lint
          pnpm --filter app run lint
          pnpm --filter www run lint
        env:
          CI: "true"
          TURBO_UI: stream
          FORCE_COLOR: "0"

      - name: Typecheck
        run: |
          set -eux
          pnpm --filter @repo/ui run check-types
          pnpm --filter app run check-types
          pnpm --filter www run check-types
        env:
          CI: "true"
          TURBO_UI: stream
          FORCE_COLOR: "0"

      - name: Test (app, coverage gate 90%)
        run: |
          set -euxo pipefail
          pnpm --filter app run test:ci 2>&1 | tee jest-output.txt
        env:
          VITE_API_URL: http://api.test
          VITE_SOCKET_URL: http://socket.test
          CI: "true"
          FORCE_COLOR: "0"

      - name: Upload jest output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jest-output
          path: jest-output.txt
          if-no-files-found: ignore

      - name: Build
        run: |
          set -eux
          pnpm --filter app run build
          pnpm --filter www run build
        env:
          # www/app builds must not require real secrets in CI
          NEXT_PUBLIC_API_URL: http://api.test
          VITE_API_URL: http://api.test
          VITE_SOCKET_URL: http://socket.test
          SENTRY_AUTH_TOKEN: ""
          CI: "true"
          TURBO_UI: stream
          FORCE_COLOR: "0"
