name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Test (app, coverage gate 90%)
        run: pnpm test:ci
        env:
          VITE_API_URL: http://api.test
          VITE_SOCKET_URL: http://socket.test

      - name: Build
        run: pnpm build
        env:
          # www/app builds must not require real secrets in CI
          NEXT_PUBLIC_API_URL: http://api.test
          VITE_API_URL: http://api.test
          VITE_SOCKET_URL: http://socket.test
          SENTRY_AUTH_TOKEN: ""
